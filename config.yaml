topic:
  name: "LLM evaluation"
  description: >
    How to evaluate large language models and LLM applications: benchmarks,
    LLM-as-a-judge, evaluation metrics, and measuring reliability and safety.
  keywords:
    - LLM evaluation
    - LLM-as-a-judge
    - evaluating large language models
    - evaluation benchmark
    - judge model
  categories: [cs.CL, cs.AI, cs.LG]
  # Shown at the top of every python -m digest.label screen. Written before labelling, to stop drift.
  label_rubric: |
    y = the paper's MAIN contribution is about evaluating LLMs: new benchmarks, LLM-as-a-judge
        methods or bias, evaluation metrics, auditing model behaviour
    n = it uses an LLM or a benchmark only as a tool for something else (medicine, robotics,
        speech...), or evaluation is a side detail

fetch:
  days_back: 7
  max_results: 200

ranking:
  top_k: 20
  weights:
    bm25: 0.4
    embedding: 0.6           # only used when embeddings.provider is gemini
    feedback: 0.1            # Rocchio feedback from your 👍/👎 + y/n labels. 0.1 / (0.4 + 0.1) = 20% of the
                             # active weight with embeddings off: the share chosen by data/evals/2026-11-26.md

embeddings:
  provider: none
  model: gemini-embedding-001
  dimensions: 768

# Stage 3: an LLM scores the ranking.top_k hybrid candidates 1-10 and keeps the best top_n.
rerank:
  enabled: true
  provider: groq            # groq | gemini  (key in .env: GROQ_API_KEY / GEMINI_API_KEY)
  model: openai/gpt-oss-120b
  top_n: 5
  batch_size: 5
  prompt_version: v1        # v1 | v2 | v3 (digest/rerank.py); v1 kept: best mean NDCG@10 in data/evals/2026-11-26.md

# Stage 4: summarize the top_n papers (same LLM as rerank). Summaries are cached in the DB.
summarize:
  enabled: true
  max_input_tokens: 3000    # per paper: abstract + intro + conclusion from the PDF
  pdf_delay_seconds: 3      # arXiv asks for at most 1 request every 3 seconds

# Stage 5: post the digest as a GitHub issue (one comment per paper; react 👍/👎 for feedback).
# Needs GITHUB_TOKEN (Issues: read and write) and GITHUB_REPO=owner/name in .env.
deliver:
  provider: github          # github | none
  close_previous: true      # close last run's digest issue when the new one is posted
  comment_delay_seconds: 1  # GitHub asks for ~1s between posts
  feedback_days: 30         # python -m digest.feedback reads reactions this far back
  feedback_users: []        # whose reactions count; empty = the repo owner only

database:
  path: data/digest.db
  labels_path: data/labels.db   # your y/n labels + eval cache; you commit it, CI only reads it